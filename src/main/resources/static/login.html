<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — MailBridge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="auth.js"></script>
<script>redirectIfAuth();</script>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="10" fill="#eff6ff"/><rect x="4" y="22" width="28" height="3" rx="1.5" fill="#3b82f6"/><rect x="7" y="12" width="3" height="13" rx="1" fill="#1d4ed8"/><rect x="26" y="12" width="3" height="13" rx="1" fill="#1d4ed8"/><line x1="8.5" y1="12" x2="18" y2="22" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/><line x1="8.5" y1="12" x2="13" y2="22" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/><line x1="27.5" y1="12" x2="18" y2="22" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/><line x1="27.5" y1="12" x2="23" y2="22" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/><rect x="6.5" y="10" width="4" height="3" rx="1" fill="#1d4ed8"/><rect x="25.5" y="10" width="4" height="3" rx="1" fill="#1d4ed8"/></svg>
      <span class="logo-text" style="font-size:22px">Mail<span style="color:var(--blue)">Bridge</span></span>
    </div>
    <div class="auth-title">Bem-vindo de volta</div>
    <div class="auth-sub">Entra na tua conta para continuar</div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="joao@exemplo.pt" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="••••••••"></div>
    <div class="toast" id="toast"></div>
    <button class="btn btn-primary btn-full" id="btn" onclick="doLogin()">Entrar</button>
    <div class="auth-switch">Não tens conta? <a href="register.html">Registar</a></div>
  </div>
</div>

<script>
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn');
    if (!email || !password) { toast('toast', 'Preenche todos os campos', 'error'); return; }
    btn.disabled = true; btn.textContent = 'A entrar...';
    try {
      const res = await fetch(API + '/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { toast('toast', data.error, 'error'); return; }
      saveSession(data);
      window.location.href = 'index.html';
    } catch { toast('toast', 'Erro de ligação ao servidor', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
</script>
</body>
</html>
